[tools]
java = "openjdk-25.0.2"
node = "lts"
go = "latest"
bun = "latest"
lazygit = "latest"
opencode = "latest"
codex = "latest"
claude = "latest"

"github:dmtrKovalenko/fff" = {
  version = "latest",
  matching = "fff-mcp",
  bin = "fff-mcp",
}

# Language servers
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@angular/language-server" = "latest"
"npm:@tailwindcss/language-server" = "latest"
"go:golang.org/x/tools/gopls" = "latest"
lua-language-server = "latest"

# Formatters
prettier = "latest"
stylua = "latest"
gofumpt = "latest"
google-java-format = "latest"

[settings]
minimum_release_age = "24h"
